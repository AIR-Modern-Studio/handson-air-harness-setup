name: Passo 0 # Iniciar o exercício

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Iniciar o exercício
    runs-on: ubuntu-latest
    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}
    env:
      EXERCISE_TITLE: "AI/R Harness Setup — Configurando um Outer Harness na prática"
      ISSUE_TITLE_PREFIX: "Exercício: "
      INTRO_MESSAGE: "Configure um Outer Harness num projeto real com a skill air-harness-setup, usando o agente que você já usa no dia a dia."

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Desabilitar os workflows do exercício
        run: |
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            gh workflow disable "$(basename "$workflow")" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar a mensagem de boas-vindas
        id: build-issue-body
        uses: skills/action-text-variables@v4
        with:
          template-file: .github/translations/welcome.md
          template-vars: |
            title: ${{ env.EXERCISE_TITLE }}
            login: ${{ github.actor }}
            intro_message: ${{ env.INTRO_MESSAGE }}

      - name: Criar a issue do exercício
        id: create-issue
        uses: actions/github-script@v9
        env:
          ISSUE_BODY: ${{ steps.build-issue-body.outputs.updated-text }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);

      - name: Montar o README do exercício
        id: build-readme
        uses: skills/action-text-variables@v4
        with:
          template-file: .github/translations/readme-exercise-started.md
          template-vars: |
            title: ${{ env.EXERCISE_TITLE }}
            login: ${{ github.actor }}
            issue_url: ${{ steps.create-issue.outputs.ISSUE_URL }}

      - name: Sobrescrever o README
        env:
          README_TEXT: ${{ steps.build-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit do README
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Iniciar o exercício"
          default_author: github_actions

  post_next_step_content:
    name: Postar o passo 1
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Comentário - conteúdo do passo 1
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/1-step.md
          vars: |
            full_repo_name: ${{ github.repository }}
            repo_name: ${{ github.event.repository.name }}
            code_dir: projeto

      - name: Comentário - acompanhando
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/watching-for-progress.md

      - name: Habilitar o passo 1
        run: gh workflow enable "Passo 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
