name: Passo 0 # Iniciar o exercício

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Iniciar o exercício
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.3
    with:
      exercise-title: "AI/R Harness Setup — Configurando um Outer Harness na prática"
      issue-title-prefix: "Exercício: "
      intro-message: "Configure um Outer Harness num projeto real com a skill air-harness-setup, usando o agente que você já usa no dia a dia."

  post_next_step_content:
    name: Postar o passo 1
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Comentário - conteúdo do passo 1
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/1-step.md
          vars: |
            full_repo_name: ${{ github.repository }}
            repo_name: ${{ github.event.repository.name }}
            code_dir: projeto

      - name: Comentário - acompanhando
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/watching-for-progress.md

      - name: Habilitar o passo 1
        run: gh workflow enable "Passo 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  translate_readme:
    name: Traduzir o README gerado
    runs-on: ubuntu-latest
    needs: [start_exercise]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Traduzir frases do README
        run: |
          sed -i 's/Mona here\. I'\''m done preparing your exercise\. Hope you enjoy!/Terminei de preparar o seu exercício. Bom trabalho!/g' README.md
          sed -i 's/Remember, it'\''s self-paced so feel free to take a break!/O exercício é no seu ritmo: pode pausar quando quiser./g' README.md
          sed -i 's/Go%20to%20Exercise/Ir%20para%20o%20Exerc%C3%ADcio/g' README.md

      - name: Commit do README traduzido
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Traduzir README gerado para português"
          default_author: github_actions
