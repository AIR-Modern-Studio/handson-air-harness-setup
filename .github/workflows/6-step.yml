name: Passo 6

on:
  push:
    branches:
      - main
    paths:
      - 'projeto/**'

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  find_exercise:
    if: |
      !github.event.repository.is_template
    name: Encontrar a issue do exercício
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercício:"

  check_step_work:
    name: Verificar o trabalho do passo
    needs: [find_exercise]
    runs-on: ubuntu-latest
    outputs:
      vars: ${{ steps.check.outputs.vars }}
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Encontrar o último comentário
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Comentário - verificando
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/translations/checking-work.md
          edit-mode: replace

      - name: Preparar o Node (npm audit)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verificar o passo 6
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/check_step.py 6

      - name: Comentário - resultado do passo
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/translations/step-results-table.md
          vars: ${{ steps.check.outputs.vars }}

      - name: Falhar se alguma verificação não passou
        if: steps.check.outputs.passed != 'true'
        run: exit 1

  post_review_content:
    name: Postar a revisão
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Comentário - revisão a seguir
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/lesson-review.md

      - name: Comentário - revisão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/x-review.md
          vars: ${{ needs.check_step_work.outputs.vars }}

      - name: Desabilitar este passo
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Encerrar o exercício
    needs: [find_exercise, post_review_content]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Montar o README de conclusão
        id: build-readme
        uses: skills/action-text-variables@v4
        with:
          template-file: .github/translations/readme-exercise-finished.md
          template-vars: |
            title: AI/R Harness Setup — Configurando um Outer Harness na prática
            login: ${{ github.actor }}
            issue_url: ${{ env.ISSUE_URL }}

      - name: Sobrescrever o README
        env:
          README_TEXT: ${{ steps.build-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit do README
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Concluir o exercício"
          default_author: github_actions

      - name: Comentário - exercício concluído
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/exercise-finished.md
          vars: |
            login: ${{ github.actor }}

      - name: Fechar a issue
        run: gh issue close "${{ env.ISSUE_URL }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
